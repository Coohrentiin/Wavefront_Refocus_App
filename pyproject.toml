[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefront-refocus"
version = "0.1.0"
description = "Interactive refocusing of DHM-reconstructed wavefronts (PySide6)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Corentin Soubeiran" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-python",
    "tifffile",
    "matplotlib",
]

[project.optional-dependencies]
gpu = ["torch"]
dev = ["pytest"]

[project.scripts]
wavefront-refocus = "wavefront_refocus.app:main"

[tool.setuptools.packages.find]
include = ["wavefront_refocus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
